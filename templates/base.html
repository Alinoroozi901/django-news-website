<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}NewsPapperApp{% endblock title %}</title>
    <meta name="viewport" content="width=device-width">
    <!-- Bootstrap CSS -->
    {% block qq %}<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>{% endblock qq %}
</head>
<body>
    <div>
        <header class="p-3 mb-3 border-bottom">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="{% url 'home' %}" class="navbar-brand">Newspaper</a>
                    <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    {% if user.is_authenticated %}
                    </ul>
                    <a href="{% url 'article_create' %}" class="nav-link px-2 link-danger btn btn-warning me-2 text-decoration-none d-block">+ new</a>
                    <div class="dropdown text-end">

                        <a href="#" class="d-block link-white text-decoration-none dropdown-toggle btn btn-primary me-2" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">{{ user.username }}</a>
                        <ul class="dropdown-menu text-small" aria-labelledby="dropdownUser1">
                            {% if user.is_staff %}
                                <li><a href="http://127.0.0.1:8000/admin/" class="dropdown-item">admin</a></li>
                            {% endif %}
                            <li><a href="{% url 'password_change' %}" class="dropdown-item">Change Password</a></li>
                            <li><a href="#" onclick="document.getElementById('logout-form').submit();" class="dropdown-item">Peace Out!</a></li>
                        </ul>
                    </div>
                    {% else %}
                    </ul>
                    <div class="text-end">
                        <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Log In</a>
                        <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </header>
    </div>
    <main>
        {% block content %}
        {% endblock content %}
    </main>
    <form id="logout-form" method="post" action="{% url 'logout' %}" style="display: none;">{% csrf_token %}</form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

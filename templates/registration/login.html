{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}LOG_IN{% endblock title %}

{% block content %}
<h2>LOG IN</h2> 
<form action="" method="post">{% csrf_token %}

</form>
<p><a href="{% url 'password_reset' %}">Forgot Your Password???</a></p>
{% endblock content %}

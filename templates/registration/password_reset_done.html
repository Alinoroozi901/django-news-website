{% extends "base.html" %}

{% block title %}Email Sent{% endblock title %}

{% block w %}
<style>
    h1 {
        font-family: 'Playfair Display', Georgia, serif;
        color: var(--dark);
        letter-spacing: 3px;
        text-transform: uppercase;
        border-bottom: 2px double var(--border);
        padding-bottom: 8px;
        margin-bottom: 20px;
    }
    .message-box {
        background-color: var(--surface);
        border: 2px solid var(--dark);
        border-radius: 2px;
        box-shadow: 6px 6px 0px var(--border);
        padding: 24px;
        width: 420px;
        font-family: Georgia, serif;
        color: var(--dark);
    }
</style>
{% endblock w %}

{% block content %}
<h1>Check Your Inbox</h1>
<div class="message-box">
    You should receive the password reset email shortly. Please check your inbox and follow the instructions.
</div>
{% endblock content %}

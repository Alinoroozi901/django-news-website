{% extends "base.html" %}

{% block title %}Forgot Your Password?{% endblock title %}

{% block w %}
<style>
    h1 {
        font-family: 'Playfair Display', Georgia, serif;
        color: var(--dark);
        letter-spacing: 3px;
        text-transform: uppercase;
        border-bottom: 2px double var(--border);
        padding-bottom: 8px;
        margin-bottom: 10px;
    }
    p {
        color: var(--text-light);
        font-size: 0.9rem;
        margin-bottom: 20px;
    }
    .form-wrapper {
        width: 420px;
        background-color: var(--surface);
        border: 2px solid var(--dark);
        border-radius: 2px;
        box-shadow: 6px 6px 0px var(--border);
    }
    .form-header {
        background-color: var(--dark);
        color: var(--bg);
        text-align: center;
        padding: 12px;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--border);
    }
    .form-body { padding: 24px; }
    label {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: bold;
        color: var(--dark);
        font-size: 0.9rem;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 4px;
    }
    input[type=email] {
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 8px 12px;
        font-family: Georgia, serif;
        color: var(--dark);
        width: 100%;
        margin-bottom: 16px;
        transition: 0.3s;
    }
    input[type=email]:focus {
        background-color: white;
        outline: none;
        border-color: var(--dark);
    }
    .btn-submit {
        background-color: var(--dark);
        color: var(--bg);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 8px 24px;
        font-family: 'Playfair Display', Georgia, serif;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-submit:hover {
        background-color: var(--accent);
        color: white;
    }
</style>
{% endblock w %}

{% block content %}
<h1>Forgot Your Password?</h1>
<p>Enter your email and we will send you a password reset link.</p>
<div class="form-wrapper">
    <div class="form-header">Password Reset</div>
    <div class="form-body">
        <form method="POST">
            {% csrf_token %}
            <label for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email" required>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock content %}

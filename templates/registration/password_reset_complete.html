{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock title %}

{% block w %}
<style>
    h1 {
        font-family: 'Playfair Display', Georgia, serif;
        color: var(--dark);
        letter-spacing: 3px;
        text-transform: uppercase;
        border-bottom: 2px double var(--border);
        padding-bottom: 8px;
        margin-bottom: 20px;
    }
    .message-box {
        background-color: var(--surface);
        border: 2px solid var(--dark);
        border-radius: 2px;
        box-shadow: 6px 6px 0px var(--border);
        padding: 24px;
        width: 420px;
        font-family: Georgia, serif;
        color: var(--dark);
    }
    .message-box a {
        color: var(--accent);
        font-family: 'Playfair Display', Georgia, serif;
        text-decoration: none;
        border-bottom: 1px solid var(--border);
    }
    .message-box a:hover {
        color: var(--dark);
    }
</style>
{% endblock w %}

{% block content %}
<h1>Password Reset Complete</h1>
<div class="message-box">
    Your new password has been set successfully.
    You can now <a href="{% url 'login' %}">Log In</a> with your new password.
</div>
{% endblock content %}
